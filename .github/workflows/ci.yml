name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Not ubuntu-latest: the runner's Postgres client has to match the postgres:16
    # service, because the restore drill refuses a client whose major version
    # differs — a newer pg_dump writes `SET transaction_timeout`, which Postgres
    # 16 rejects halfway through the restore. 24.04 ships PostgreSQL 16. The
    # deploy job pins the same image for the same class of reason: a floating
    # label should not change what the build tests.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The restore drill runs against the same Postgres service, so it cannot
      # rot unnoticed. sqlx-cli writes the same SHA-384 checksums as the sqlx
      # the workspace builds on, so the migrated fixture is one `nata_db::migrate`
      # would accept. The runner is pinned to 24.04 so its pg_dump is 16, the
      # same major as the service; backup.sh fails loudly on any other pair.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Apply migrations
        run: sqlx migrate run

      - name: Backup restore drill
        run: deploy/vps/backup.sh --self-test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run --filter web typecheck
      - run: bun run --filter web build
