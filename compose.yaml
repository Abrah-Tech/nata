# Local development database. Credentials are intentionally weak and
# must never be reused outside a developer machine.
services:
  db:
    image: postgres:16-alpine
    container_name: nata-db
    environment:
      POSTGRES_USER: nata
      POSTGRES_PASSWORD: nata
      POSTGRES_DB: nata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nata -d nata"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nata-db-data:
